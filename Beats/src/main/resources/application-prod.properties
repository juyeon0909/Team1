spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_ENDPOINT}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&useSSL=true
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PWD}

#update?? ?? sleep?? ?? ??? ????..
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

spring.devtools.restart.enabled=false

# [보안] 운영 환경 로그 레벨.
# 공통 application.properties 에 켜둔 Security DEBUG / Hibernate SQL trace 는
# 운영 로그에 인증 흐름과 SQL 바인딩 값(민감정보)을 남길 수 있으므로 여기서 끈다.
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO