name: Spring Boot CD

on:
  workflow_run:
    workflows:
      - "Spring Boot CI"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull "${{ secrets.DOCKER_IMAGE }}"
            docker stop "${{ secrets.DOCKER_CONTAINER }}" || true
            docker rm "${{ secrets.DOCKER_CONTAINER }}" || true
            docker run -d --name "${{ secrets.DOCKER_CONTAINER }}"  \
            -p 80:9000 "${{ secrets.DOCKER_IMAGE }}"\
            -e DB_ENDPOINT="${{ secrets.DB_ENDPOINT }}" \
            -e DB_PORT="${{ secrets.DB_PORT }}" \
            -e DB_NAME="${{ secrets.DB_NAME }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            "${{ secrets.DOCKER_IMAGE }}"