# ============================================================================
# eatsfridge.site  nginx 서버 블록 (보안 헤더 적용 버전)
# ----------------------------------------------------------------------------
# 목적: SafeDomain 스캔에서 지적된 4개 헤더 문제를 해결한다.
#   - HSTS (Strict-Transport-Security)
#   - Content-Security-Policy
#   - X-Content-Type-Options
#   - X-Frame-Options  (CSP frame-ancestors 로도 대체)
#   - Referrer-Policy
#
# 적용 방법:
#   기존 서버 파일(보통 /etc/nginx/sites-available/eatsfridge 또는
#   /etc/nginx/conf.d/eatsfridge.conf)을 열어, 아래 "## 보안 헤더 시작 ##" ~
#   "## 보안 헤더 끝 ##" 블록만 복사해서 server { ... } 안에 붙여넣어도 된다.
#   아래는 전체 구조를 보여주는 참고용 전체 블록이다.
#   (ssl_certificate 등 인증서/프록시 경로는 현재 서버에 맞춰 수정할 것)
# ============================================================================

# ---------------------------------------------------------------------------
# (0) 브루트포스 방어용 레이트리밋 정의 (http 블록 레벨)
#     ※ 이 두 줄은 server { } 밖, /etc/nginx/nginx.conf 의 http { } 안에
#       두어야 한다. 같은 IP가 로그인/비밀번호 재설정을 과도하게 두드리지 못하게 한다.
#     login  : 분당 10회 (로그인·재설정 인증번호)
#     binary_remote_addr = 접속 IP를 키로 사용
# ---------------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# ---------------------------------------------------------------------------
# (1) HTTP(80) 요청은 무조건 HTTPS(443)로 돌려보낸다.
#     HSTS가 의미를 가지려면 먼저 HTTPS로 강제 이동시켜야 한다.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name eatsfridge.site www.eatsfridge.site;

    # 301: "영구 이동" 상태코드. 브라우저가 다음부터 알아서 https로 접속한다.
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# (2) 실제 서비스를 담당하는 HTTPS(443) 서버 블록
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eatsfridge.site www.eatsfridge.site;

    # --- TLS 인증서 경로 (현재 서버 설정값 그대로 두면 됨) ---
    # ACM(CloudFront/ALB)이 앞단에서 TLS를 종료하는 구조라면, 이 nginx는
    # 평문 HTTP origin일 수 있다. 그 경우 이 ssl_* 줄과 listen 443 ssl 은
    # 기존 파일의 값을 유지하고, 핵심인 "보안 헤더 블록"만 가져다 쓰면 된다.
    ssl_certificate     /etc/ssl/eatsfridge/fullchain.pem;   # 예시 경로
    ssl_certificate_key /etc/ssl/eatsfridge/privkey.pem;     # 예시 경로

    # 정적 파일(React 빌드 결과물) 위치
    root  /var/www/eatsfridge;
    index index.html;

    # ====================== ## 보안 헤더 시작 ## ======================
    # add_header 의 마지막 인자 "always" 는 200 응답뿐 아니라 4xx/5xx 등
    # 모든 응답에도 헤더를 붙이라는 뜻이다. 스캐너는 아무 응답이나 보므로 필수.

    # (a) HSTS: 한 번이라도 HTTPS로 접속하면, 이후 max-age 초 동안은
    #     브라우저가 무조건 HTTPS로만 접속한다(중간자 다운그레이드 공격 차단).
    #     max-age=31536000 = 1년. includeSubDomains 는 하위 도메인까지 적용.
    #     ※ 주의: 하위 도메인 중 HTTPS가 안 되는 곳이 있으면 접속 불가가 되니,
    #       전부 HTTPS인지 확인 후 includeSubDomains 를 켤 것.
    #     ※ preload 는 브라우저 내장 목록 등록용인데, 한번 올리면 되돌리기
    #       어려우니 안정화 전까지는 일부러 빼 두었다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # (b) X-Content-Type-Options: 브라우저가 파일 확장자/내용을 멋대로 추측
    #     (MIME 스니핑)하지 못하게 막는다. nosniff 만 넣으면 된다.
    add_header X-Content-Type-Options "nosniff" always;

    # (c) X-Frame-Options: 다른 사이트가 우리 페이지를 <iframe> 안에 넣어
    #     클릭재킹 하는 것을 막는다. DENY = 어떤 곳에서도 iframe 금지.
    add_header X-Frame-Options "DENY" always;

    # (d) Referrer-Policy: 외부로 이동할 때 우리 사이트의 전체 URL(경로·쿼리)이
    #     Referer 헤더로 새어나가지 않게 한다. 같은 출처면 전체, 외부면 도메인만.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # (e) Content-Security-Policy: 로드 가능한 리소스 출처를 화이트리스트로 제한.
    #     XSS 피해를 크게 줄인다. 아래는 React(Vite) SPA용 안전한 시작값이다.
    #       default-src 'self'      : 기본은 우리 도메인 리소스만
    #       img-src ... https: data:: 이미지(S3 등 https, base64)는 폭넓게 허용
    #       style-src 'unsafe-inline': UI 라이브러리가 inline 스타일을 자주 써서 허용
    #       connect-src 'self'      : fetch/XHR(=/api 호출)는 같은 출처만
    #       frame-ancestors 'none'  : X-Frame-Options와 같은 역할(최신 표준)
    #       object-src 'none'       : 플러그인(Flash 등) 차단
    #     ※ 만약 외부 API/폰트/분석 스크립트를 쓴다면 해당 도메인을 추가해야
    #       화면이 깨지지 않는다. 처음엔 아래 "Report-Only" 방식 권장(가이드 참고).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    # ====================== ## 보안 헤더 끝 ## ======================

    # --- 브루트포스 민감 경로: 로그인·비밀번호 재설정은 레이트리밋 적용 ---
    #     (위 (0)의 limit_req_zone 주석을 먼저 해제해야 동작한다)
    # location ~ ^/api/(member/login|member/reset-password|passwordless) {
    #     limit_req zone=login burst=5 nodelay;   # 분당 10회 + 순간 5회까지 허용
    #     proxy_pass http://127.0.0.1:9000;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # --- API 프록시: /api 로 오는 요청은 Spring Boot(127.0.0.1:9000)로 전달 ---
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA 라우팅: 정적 파일 없으면 index.html 로 돌려서 React 라우터가 처리 ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
