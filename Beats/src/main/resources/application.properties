spring.application.name=Beats
server.port=9000

# ????? DB ?? (?????? ?? ??) ?????
# ? ????. ?? ????? ???.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_ENDPOINT}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PWD}

# JPA ? ?? ?? ??
spring.devtools.restart.enabled=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ????? JWT ???????
jwt.secret=${JWT_KEY}
jwt.expiration=${JWT_EXPIRATION}

# ????? AWS S3 ?????
cloud.aws.credentials.access-key=${S3_KEY}
cloud.aws.credentials.secret-key=${S3_SECRET_KEY}
cloud.aws.s3.bucket=${BUCKET_NAME}
cloud.aws.region.static=ap-northeast-2

# ????? ?? ?????
server.servlet.session.timeout=120m
logging.level.org.hibernate.type.descriptor.sql=trace

# ?? ??? ?? ?? ??
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Tomcat POST ?? ?? ?? (?? ??)
server.tomcat.max-http-form-post-size=10MB

logging.level.org.springframework.security=DEBUG
passwordless.server-url=${SERVER_URL}
passwordless.server-key=${SERVER_KEY}