name: Spring Boot CD

on:
  workflow_run:
    workflows:
      - "Spring Boot CI"
    types:
      - completed

jobs:
  deploy:
    if: >
     ${{ github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull "${{ secrets.DOCKER_IMAGE }}"
            docker stop "${{ secrets.DOCKER_CONTAINER }}" || true
            docker rm "${{ secrets.DOCKER_CONTAINER }}" || true
            docker run -d \
            --name "${{ secrets.DOCKER_CONTAINER }}" \
            --restart unless-stopped \
            -p 80:9000 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_ENDPOINT="${{ secrets.DB_ENDPOINT }}" \
            -e DB_PORT="${{ secrets.DB_PORT }}" \
            -e DB_NAME="${{ secrets.DB_NAME }}" \
            -e DB_USER_NAME="${{ secrets.DB_USER_NAME }}" \
            -e DB_PWD='${{ secrets.DB_PWD }}' \
            -e JWT_KEY='${{ secrets.JWT_KEY }}' \
            -e JWT_EXPIRATION="${{ secrets.JWT_EXPIRATION }}" \
            -e S3_KEY="${{ secrets.S3_KEY }}" \
            -e S3_SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            -e BUCKET_NAME="${{ secrets.BUCKET_NAME }}" \
            "${{ secrets.DOCKER_IMAGE }}"
