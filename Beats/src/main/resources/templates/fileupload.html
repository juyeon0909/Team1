<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 이미지 업로드</title>

    <style>

        body{
            font-family: Arial;
            margin: 40px;
        }

        .container{
            width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input[type=file]{
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button{
            width: 100%;
            height: 40px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover{
            background-color: #45a049;
        }

        img{
            margin-top: 20px;
            max-width: 100%;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>S3 이미지 업로드</h2>

    <form id="uploadForm">

        <input
                type="file"
                id="file"
                name="file"
                accept="image/*"
                required
        >

        <button type="submit">
            업로드
        </button>

    </form>

    <div id="result"></div>

</div>

<script>

    const form = document.getElementById("uploadForm");

    form.addEventListener("submit", async function (e){

        e.preventDefault();

        const fileInput = document.getElementById("file");

        const formData = new FormData();

        formData.append("file", fileInput.files[0]);

        try{

            const response = await fetch(
                "http://localhost:8080/image/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

            const data = await response.json();

            document.getElementById("result").innerHTML = `

                <h3>업로드 성공</h3>

                <p>
                    파일명 : ${data.imageName}
                </p>

                <img src="${data.imageUrl}" />

                <p>
                    URL :
                    <a href="${data.imageUrl}" target="_blank">
                        ${data.imageUrl}
                    </a>
                </p>

            `;

        }catch (error){

            console.error(error);

            alert("업로드 실패");

        }

    });

</script>

</body>
</html>
